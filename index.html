<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Empire Total — jeu de gestion hors ligne : entreprises, Bourse, collections, clubs multisports jouables, casino et gouvernement, avec un portefeuille unique.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Empire Total">
<title>Empire Total</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="hud">
  <div class="hud-top">
    <div>
      <div class="hud-money" id="hud-money">0 €</div>
      <div class="hud-rate" id="hud-rate">—</div>
    </div>
  </div>
  <div class="hud-grid">
    <div class="hud-cell"><div class="l">Patrimoine</div><div class="v" id="hud-net">—</div></div>
    <div class="hud-cell"><div class="l">Portefeuille</div><div class="v" id="hud-pf">—</div></div>
    <div class="hud-cell"><div class="l">Séance</div><div class="v" id="hud-day">—</div></div>
  </div>
  <div class="reinvest-bar" id="reinvest" data-act="ui.reinvest" style="display:none"></div>
</header>

<main id="app"></main>

<nav id="tabs"></nav>

<div id="toasts"></div>

<div class="backdrop hidden" id="backdrop">
  <div class="modal">
    <div class="modal-head">
      <span id="modal-title">—</span>
      <button class="x" data-act="ui.close" aria-label="Fermer">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Outils -->
<script src="js/core/util.js"></script>

<!-- Données du jeu -->
<script src="js/data/businesses.js"></script>
<script src="js/data/stocks.js"></script>
<script src="js/data/collections.js"></script>
<script src="js/data/names.js"></script>
<script src="js/data/sports.js"></script>
<script src="js/data/country.js"></script>

<!-- Noyau -->
<script src="js/core/state.js"></script>
<script src="js/core/economy.js"></script>
<script src="js/core/save.js"></script>

<!-- Règles du jeu -->
<script src="js/game/business.js"></script>
<script src="js/game/market.js"></script>
<script src="js/game/collections.js"></script>
<script src="js/game/manager.js"></script>
<script src="js/game/match.js"></script>
<script src="js/game/race.js"></script>
<script src="js/game/casino.js"></script>
<script src="js/game/country.js"></script>
<script src="js/core/loop.js"></script>

<!-- Interface -->
<script src="js/ui/ui.js"></script>
<script src="js/ui/view_empire.js"></script>
<script src="js/ui/view_manager.js"></script>
<script src="js/ui/view_casino.js"></script>
<script src="js/ui/view_country.js"></script>
<script src="js/ui/view_profile.js"></script>

<script src="js/main.js"></script>
</body>
</html>
